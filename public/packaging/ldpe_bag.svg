<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <rect width="400" height="280" rx="16" fill="#0F172A"/>
  <rect x="8" y="8" width="384" height="264" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <!-- Packaging Mockup -->
  <path d="M120 45 L280 45 L270 205 L130 205 Z" fill="#64748B" fill-opacity="0.15" stroke="#64748B" stroke-width="2" stroke-linejoin="round"/>
  <!-- Pouch Sealing Lines -->
  <line x1="120" y1="55" x2="280" y2="55" stroke="#64748B" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="130" y1="195" x2="270" y2="195" stroke="#64748B" stroke-width="2" stroke-dasharray="3 3"/>
  <!-- Notches and Core Detail -->
  <path d="M117 75 L125 78 L117 81" stroke="#64748B" stroke-width="1.5" fill="none"/>
  <rect x="150" y="90" width="100" height="75" rx="8" fill="#0F172A" stroke="#64748B" stroke-width="1" stroke-opacity="0.6"/>
  <!-- Layer Lines inside inspection window -->
  <line x1="160" y1="110" x2="240" y2="110" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <line x1="160" y1="125" x2="240" y2="125" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
  <line x1="160" y1="140" x2="240" y2="140" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
  <!-- Title & Text -->
  <text x="200" y="230" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Standard Low-Density Polyethylene Bag</text>
  <text x="200" y="250" text-anchor="middle" fill="#64748B" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Standard Extruded LDPE Film</text>
</svg>